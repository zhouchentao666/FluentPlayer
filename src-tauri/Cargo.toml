[package]
name = "tideaudio"
version = "0.1.0"
description = "TideAudio - 纯离线本地音乐播放器"
authors = ["zhouchentao"]
edition = "2021"
license = "MIT"

[lib]
name = "tideaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.21"
base64 = "0.22"
encoding_rs = "0.8"
notify = "6"
urlencoding = "2"

# 桌面专属插件：移动端（android/iOS）不编译，避免引入桌面专用 API
[target.'cfg(desktop)'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

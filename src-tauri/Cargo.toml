[package]
name = "tideaudio"
version = "0.1.0"
description = "TideAudio - 纯离线本地音乐播放器"
authors = ["zhouchentao"]
edition = "2021"
license = "MIT"

[lib]
name = "tideaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.21"
base64 = "0.22"
encoding_rs = "0.8"
notify = "6"
urlencoding = "2"

# 说明：autostart / single-instance 作为普通依赖（移动端也能编译，只是其
# init / MacosLauncher / ManagerExt 等为 #[cfg(desktop)]，本仓库相关调用已用
# cfg(desktop) 隔离）。这样 tauri-build 才能在所有平台发现它们的权限文件，
# capabilities 校验不会报 “autostart:allow-enable not found”。

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

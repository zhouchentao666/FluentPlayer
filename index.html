<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentPlayer</title>
    <!-- 首屏兜底背景：WebView 加载 style.css 之前默认是白底，在 acrylic
         透明窗口下会刺眼。内联深色背景让首帧立即有暗色底，style.css
         加载后 html 会被重置为 transparent，acrylic 窗口特效照常生效。
         跟随系统浅色偏好给出浅灰兜底，避免浅色模式首屏过暗。 -->
    <style>
      html { background-color: #1f1f1f; }
      @media (prefers-color-scheme: light) {
        html { background-color: #f3f3f3; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentPlayer</title>
    <style>
      /* 启动期遮罩：在 WebView 渲染空文档、Vue 挂载前避免白屏闪现。
         背景与窗口 windowEffects(acrylic/mica) 一致 —— 深色透明，
         保证透明窗口在字体/JS 加载前也是深色底，不闪白。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent;
        color-scheme: dark;
      }
      #app {
        width: 100%;
        height: 100%;
        background-color: rgba(20, 20, 22, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
